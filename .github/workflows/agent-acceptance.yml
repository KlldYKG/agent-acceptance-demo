name: agent-acceptance (demo)
on: pull_request_target
permissions:
  contents: read
  pull-requests: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      # The code under test: the PR HEAD revision (always exists) + the base
      # revision fetched separately. This avoids the racy refs/pull/N/merge
      # ref, which GitHub may not have computed when the workflow starts.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
      - name: Fetch base revision
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      # The action code itself ALWAYS comes from the trusted base branch (main),
      # never from the (possibly stale) merge ref. This is the documented safe
      # pattern for pull_request_target workflows.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: aa-trusted
      # TODO: replace with the published action ref (org/agent-acceptance@v0).
      - uses: ./aa-trusted/tool/action
        with:
          github-token: ${{ github.token }}
