name: agent-acceptance (demo)
on: pull_request_target
permissions:
  contents: read
  pull-requests: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      # The code under test: the PR HEAD revision (always exists) + the base
      # revision fetched separately. This avoids the racy refs/pull/N/merge
      # ref, which GitHub may not have computed when the workflow starts.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
      - name: Fetch base revision
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      # The action lives in the tool repository and is pinned by commit SHA
      # (supply-chain baseline; floating tags are disabled on purpose).
      - uses: KlldYKG/agent-acceptance/action@2911e98c9c8a2f58d9448dcada8de8ecee7cbd4a
        with:
          github-token: ${{ github.token }}
