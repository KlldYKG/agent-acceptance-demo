name: agent-acceptance (demo)
on: pull_request_target
permissions:
  contents: read
  pull-requests: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
      # Replace with the published action ref (org/agent-acceptance@v0) after release.
      - uses: ./tool/action
